<!doctype html>
<html>
<head>
<meta charset="utf-8">
<!--
  Kaivor promo: Gradient and holographic role colours (aurora-bot commit 3e8856c).
  Look: "paint chips" — plaster #F2EEE7 and umber-black #211B19 alternating by shot, one accent (raspberry #C73B63),
  paint-swatch chips with hex labels as the recurring motif. Syne for headlines, Rethink Sans for the chat UI,
  Martian Mono only for the commands. The only gradients on screen are the role names themselves (the feature).
  Facts checked in src/services/roles/colors.ts, src/commands/roles/role.ts, src/commands/boosterrole/boosterrole.ts,
  src/parsers/color.ts, src/framework/context.ts, src/framework/embeds.ts, src/framework/icons.ts:
    - usage: role color <role> <colour> [second colour]; examples include "role color VIP holographic"
    - two colours -> kind 'gradient'; "holo"/"holographic" -> Discord's holographic style
    - reply: ctx.success(`${role} is now ${describeRoleColors(parsed)}.`)
        gradient    -> "is now a gradient from `#e8475f` to `#f5a524`."  (colorToHex = lowercase #rrggbb)
        holographic -> "is now holographic."
    - exact role name "VIP" -> no partial-match question (resolveRoleArgConfirmed)
    - without the perk: "Gradient and holographic colours need the server’s Enhanced Role Styles perk, which comes with boost level 2."
    - boosterrole color takes the same: one colour, two for a gradient, or holographic (once every 5 minutes)
    - success embeds: COLORS.success 0x5bc98c, icon fallback ✅
  Sound: own sound (music/ is empty), 124 BPM; every shot is a whole number of beats (see sound.py).
-->
<style>
@font-face { font-family: 'Syne'; font-weight: 800; src: url('../../node_modules/@fontsource/syne/files/syne-latin-800-normal.woff2'); }
@font-face { font-family: 'Syne'; font-weight: 600; src: url('../../node_modules/@fontsource/syne/files/syne-latin-600-normal.woff2'); }
@font-face { font-family: 'Reth'; font-weight: 400; src: url('../../node_modules/@fontsource/rethink-sans/files/rethink-sans-latin-400-normal.woff2'); }
@font-face { font-family: 'Reth'; font-weight: 500; src: url('../../node_modules/@fontsource/rethink-sans/files/rethink-sans-latin-500-normal.woff2'); }
@font-face { font-family: 'Reth'; font-weight: 600; src: url('../../node_modules/@fontsource/rethink-sans/files/rethink-sans-latin-600-normal.woff2'); }
@font-face { font-family: 'Reth'; font-weight: 700; src: url('../../node_modules/@fontsource/rethink-sans/files/rethink-sans-latin-700-normal.woff2'); }
@font-face { font-family: 'Mart'; font-weight: 400; src: url('../../node_modules/@fontsource/martian-mono/files/martian-mono-latin-400-normal.woff2'); }
@font-face { font-family: 'Mart'; font-weight: 500; src: url('../../node_modules/@fontsource/martian-mono/files/martian-mono-latin-500-normal.woff2'); }

:root { --plaster: #F2EEE7; --umber: #211B19; --ink: #2A2320; --accent: #C73B63; --g1: #e8475f; --g2: #f5a524; }
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1080px; height: 1920px; overflow: hidden; background: var(--umber); }
.shot { position: absolute; inset: 0; display: none; }
.dark { background: var(--umber); color: var(--plaster); }
.light { background: var(--plaster); color: var(--ink); }

.head { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Syne'; font-weight: 800; letter-spacing: -0.03em; }
.line { display: block; overflow: hidden; padding-bottom: 0.06em; }
.line > span { display: inline-block; will-change: transform; }
.kicker { font-family: 'Syne'; font-weight: 600; font-size: 34px; letter-spacing: 0.14em; text-transform: uppercase; position: absolute; left: 0; right: 0; text-align: center; }
.sub { position: absolute; left: 140px; right: 140px; text-align: center; font-family: 'Reth'; font-weight: 500; font-size: 40px; line-height: 1.35; }

/* generic Discord-style chat (no Discord logo or wordmark) */
.chat { position: absolute; left: 70px; width: 940px; background: #313338; border-radius: 10px; overflow: hidden;
        font-family: 'Reth'; color: #DBDEE1; display: flex; flex-direction: column; }
.chat .top { height: 96px; flex: none; display: flex; align-items: center; gap: 18px; padding: 0 34px; border-bottom: 2px solid #26282C; }
.chat .top .hash { font-size: 50px; color: #80848E; font-weight: 500; }
.chat .top .name { font-size: 38px; font-weight: 700; color: #F2F3F5; }
.chat .top .topic { font-size: 30px; color: #949BA4; border-left: 2px solid #3F4147; padding-left: 18px; margin-left: 4px; }
.chat .list { flex: 1; overflow: hidden; position: relative; }
.chat .stack { position: absolute; left: 0; right: 0; bottom: 0; padding: 0 0 18px; }
.msg { display: flex; gap: 26px; padding: 14px 34px; }
.av { width: 84px; height: 84px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center;
      font-weight: 700; font-size: 36px; color: #fff; overflow: hidden; }
.av img { width: 100%; height: 100%; display: block; }
.body { min-width: 0; flex: 1; }
.meta { display: flex; align-items: baseline; gap: 14px; }
.who { font-size: 34px; font-weight: 600; }
.who.grad { background: linear-gradient(90deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.who.holo { background: linear-gradient(90deg, #A9C9FF, #FFBBEC, #FFC3A0, #A9C9FF, #FFBBEC); background-size: 300% 100%;
            -webkit-background-clip: text; background-clip: text; color: transparent; }
.app { font-size: 20px; font-weight: 700; color: #fff; background: #5865F2; border-radius: 6px; padding: 3px 9px; transform: translateY(-4px); }
.time { font-size: 24px; color: #949BA4; }
.text { font-size: 34px; line-height: 1.38; color: #DBDEE1; margin-top: 4px; }
.text.cmd { font-family: 'Mart'; font-size: 27px; }
.rmention { border-radius: 6px; padding: 0 6px; font-weight: 600; }
.embed { margin-top: 10px; background: #2B2D31; border-radius: 6px; border-left: 8px solid #5BC98C; padding: 22px 28px; font-size: 32px; line-height: 1.5; max-width: 780px; }
code { font-family: 'Mart'; font-size: 24px; background: #1E1F22; border-radius: 6px; padding: 3px 8px; color: #DBDEE1; }
.input { flex: none; margin: 0 26px 26px; height: 92px; background: #383A40; border-radius: 12px; display: flex; align-items: center; gap: 22px; padding: 0 26px; position: relative; }
.plus { width: 46px; height: 46px; border-radius: 50%; background: #B5BAC1; color: #383A40; font-size: 40px; font-weight: 700;
        display: flex; align-items: center; justify-content: center; line-height: 1; flex: none; }
.ph { font-size: 32px; color: #6D6F78; white-space: nowrap; overflow: hidden; }
.typed { font-family: 'Mart'; font-size: 27px; color: #DBDEE1; white-space: nowrap; overflow: hidden; }
.caret { display: inline-block; width: 3px; height: 34px; background: #DBDEE1; vertical-align: middle; margin-left: 2px; }
.typing { position: absolute; left: 30px; bottom: -2px; font-size: 22px; color: #B5BAC1; }
.cursor { position: absolute; width: 54px; height: 54px; z-index: 5; pointer-events: none; }

/* paint chips */
.chips { position: absolute; left: 0; right: 0; display: flex; justify-content: center; gap: 18px; }
.chip { width: 164px; background: #FBF9F5; padding: 12px 12px 18px; border: 2px solid rgba(0,0,0,.08); }
.dark .chip { background: #2E2724; border-color: rgba(255,255,255,.06); }
.chip .sw { height: 250px; }
.chip .lb { font-family: 'Reth'; font-weight: 600; font-size: 22px; margin-top: 12px; letter-spacing: 0.02em; }
.chip .nm { font-family: 'Reth'; font-weight: 400; font-size: 18px; opacity: .6; margin-top: 2px; }

/* member list */
.members { position: absolute; left: 70px; width: 940px; background: #2B2D31; border-radius: 10px; padding: 18px 40px 26px; font-family: 'Reth'; }
.grp { font-size: 26px; font-weight: 700; color: #949BA4; letter-spacing: .05em; text-transform: uppercase; margin: 16px 0 6px; }
.mem { display: flex; align-items: center; gap: 28px; padding: 12px 0; }
.mem .av { width: 96px; height: 96px; font-size: 40px; }
.mem .nm { font-size: 56px; font-weight: 700; color: #F2F3F5; letter-spacing: -0.01em; }
.members.big .grp { font-size: 30px; margin: 24px 0 8px; }
.members.big .mem { padding: 20px 0; gap: 34px; }
.members.big .mem .av { width: 124px; height: 124px; font-size: 52px; }
.members.big .mem .nm { font-size: 70px; }
.nm.grad { background: linear-gradient(90deg, var(--g1), var(--g2)); -webkit-background-clip: text; background-clip: text; color: transparent; }
.nm.holo { background: linear-gradient(90deg, #A9C9FF, #FFBBEC, #FFC3A0, #A9C9FF, #FFBBEC); background-size: 300% 100%;
           -webkit-background-clip: text; background-clip: text; color: transparent; }
.logo { position: absolute; left: 50%; width: 260px; height: 260px; margin-left: -130px; }
.cmd { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Mart'; font-weight: 500; font-size: 30px; }
.cmd span { background: var(--ink); color: var(--plaster); padding: 14px 24px; }
.url { position: absolute; left: 0; right: 0; text-align: center; font-family: 'Syne'; font-weight: 800; font-size: 54px; letter-spacing: -0.02em; }
</style>
</head>
<body>

<!-- 0 hook -->
<section class="shot light" id="s0">
  <div class="head" style="top:140px;font-size:86px;line-height:1.02">
    <span class="line"><span>Your VIP role</span></span>
    <span class="line"><span>blends <span style="color:var(--accent)">right in.</span></span></span>
  </div>
  <div class="chat" id="chat0" style="top:430px;height:1330px"></div>
</section>

<!-- 1 turn -->
<section class="shot dark" id="s1">
  <div class="head" style="top:520px;font-size:118px;line-height:1.0">
    <span class="line"><span>Give it</span></span>
    <span class="line"><span>a gradient.</span></span>
  </div>
  <div class="chips" id="chips1" style="top:900px"></div>
</section>

<!-- 2 action -->
<section class="shot light" id="s2">
  <div class="kicker" style="top:290px;color:var(--accent)">One command</div>
  <div class="chat" id="chat2" style="top:390px;height:1370px"></div>
  <svg class="cursor" id="cur2" viewBox="0 0 24 24"><path d="M4 2 L4 19 L8.6 14.8 L11.6 21.4 L14.4 20.2 L11.5 13.7 L17.6 13.5 Z" fill="#F2EEE7" stroke="#211B19" stroke-width="1.4" stroke-linejoin="round"/></svg>
</section>

<!-- 3 result -->
<section class="shot dark" id="s3">
  <div class="head" style="top:330px;font-size:100px;line-height:1.0">
    <span class="line"><span>Now you</span></span>
    <span class="line"><span>can tell.</span></span>
  </div>
  <div class="members big" id="mem3" style="top:620px"></div>
</section>

<!-- 4 holographic -->
<section class="shot light" id="s4">
  <div class="kicker" style="top:200px;color:var(--accent)">Or go holographic</div>
  <div class="chat" id="chat4" style="top:300px;height:1000px"></div>
  <div class="members" id="mem4" style="top:1340px"></div>
</section>

<!-- 5 key fact -->
<section class="shot dark" id="s5">
  <div class="head" style="top:700px;font-size:90px;line-height:1.04">
    <span class="line"><span>Needs boost</span></span>
    <span class="line"><span style="color:#E8748F">level 2.</span></span>
  </div>
  <div class="sub" id="sub5" style="top:960px;color:#CFC6BD">Gradients and holographic use the server’s Enhanced Role Styles perk.</div>
</section>

<!-- 6 end card -->
<section class="shot light" id="s6">
  <img class="logo" id="logo6" src="../../assets/kaivor-logo.png" style="top:410px">
  <div class="kicker" style="top:770px;color:var(--accent)">New in Kaivor</div>
  <div class="head" style="top:840px;font-size:104px;line-height:1.0">
    <span class="line"><span>Gradient</span></span>
    <span class="line"><span>role colours</span></span>
  </div>
  <div class="chips" id="chips6" style="top:1090px;gap:0"></div>
  <div class="cmd" style="top:1210px" id="cmd6a"><span>,role color VIP #e8475f #f5a524</span></div>
  <div class="cmd" style="top:1310px" id="cmd6b"><span>,role color VIP holographic</span></div>
  <div class="url" style="top:1450px" id="url6">kaivor.space</div>
</section>

<script>
const FPS = 60;
const BEAT = 60 / 124;
const beats = [6, 2, 9, 7, 8, 5, 7];
const names = ['hook', 'turn', 'action', 'result', 'holographic', 'fact', 'end'];
window.VIDEO = { fps: FPS, bpm: 124, shots: beats.map((b, i) => ({ name: names[i], seconds: b * BEAT })) };

const out4 = (t) => 1 - Math.pow(1 - Math.min(1, Math.max(0, t)), 4);
const inOut = (t) => { t = Math.min(1, Math.max(0, t)); return t < .5 ? 8 * t ** 4 : 1 - Math.pow(-2 * t + 2, 4) / 2; };
const p = (t, a, d) => Math.min(1, Math.max(0, (t - a) / d));
const B = (n) => n * BEAT;

// made-up users; VIPs are mira and noor
const U = {
  teo:   { name: 'teo', bg: '#7A6A5E', i: 'T' },
  mira:  { name: 'mira', bg: '#8C5BA8', i: 'M', vip: true },
  noor:  { name: 'noor', bg: '#B5713A', i: 'N', vip: true },
  gift:  { name: 'gift_drop4821', bg: '#5D6470', i: 'G' },
  kofi:  { name: 'kofi', bg: '#2E7FA8', i: 'K' },
  bot:   { name: 'Kaivor', bot: true },
};
const esc = (s) => s.replace(/&/g, '&amp;').replace(/</g, '&lt;');
const md = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>')
  .replace(/\{@VIP\}/g, '<span class="rmention" style="color:#F07A8C;background:rgba(232,71,95,.16)">@VIP</span>');

// style: 'flat' | 'grad' | 'holo' for VIP names
function msgHTML(m, i, arr, style, holoShift) {
  const u = U[m.u];
  const grouped = i > 0 && arr[i - 1].u === m.u;
  const av = u.bot ? `<div class="av"><img src="../../assets/icon-512.png"></div>` : `<div class="av" style="background:${u.bg}">${u.i}</div>`;
  const app = u.bot ? '<span class="app">APP</span>' : '';
  const content = m.embed ? `<div class="embed">✅ ${md(m.embed)}</div>`
    : `<div class="text${m.cmd ? ' cmd' : ''}">${md(m.text)}</div>`;
  if (grouped) return `<div class="msg" style="padding-top:2px"><div class="av" style="height:0"></div><div class="body">${content}</div></div>`;
  let cls = 'who', st = 'color:#F2F3F5';
  if (u.vip && style === 'grad') { cls += ' grad'; st = ''; }
  if (u.vip && style === 'holo') { cls += ' holo'; st = `background-position:${holoShift}% 0`; }
  return `<div class="msg">${av}<div class="body"><div class="meta"><span class="${cls}" style="${st}">${u.name}</span>${app}<span class="time">Today at ${m.time || '20:41'}</span></div>${content}</div></div>`;
}

function renderChat(el, t, msgs, input, style = 'flat', holoShift = 0) {
  const shown = msgs.filter((m) => t >= m.at);
  const newest = shown[shown.length - 1];
  el.innerHTML = `
    <div class="top"><span class="hash">#</span><span class="name">general</span><span class="topic">hang out, be nice</span></div>
    <div class="list"><div class="stack">${shown.map((m, i, a) => msgHTML(m, i, a, style, holoShift)).join('')}</div></div>
    <div class="input"><span class="plus">+</span>${input && input.text !== undefined
      ? `<span class="typed">${esc(input.text)}${input.caret ? '<span class="caret"></span>' : ''}</span>`
      : '<span class="ph">Message #general</span>'}
      ${input && input.typing ? '<span class="typing"><b>Kaivor</b> is typing…</span>' : ''}</div>`;
  if (newest && newest.at >= 0) {
    const stack = el.querySelector('.stack');
    const last = stack.lastElementChild;
    const e = out4(p(t, newest.at, 0.22));
    stack.style.transform = `translateY(${(1 - e) * last.offsetHeight}px)`;
    last.style.opacity = String(e);
  }
}

function lines(sec, t, start, gap) {
  sec.querySelectorAll('.line > span').forEach((s, i) => {
    const e = out4(p(t, start + i * gap, 0.45));
    s.style.transform = `translateY(${(1 - e) * 108}%)`;
  });
}

// paint chips: five steps between the two gradient colours
const hex = (n) => n.toString(16).padStart(2, '0');
function mixHex(a, b, k) {
  const pa = [1, 3, 5].map((i) => parseInt(a.slice(i, i + 2), 16));
  const pb = [1, 3, 5].map((i) => parseInt(b.slice(i, i + 2), 16));
  return '#' + pa.map((v, i) => hex(Math.round(v + (pb[i] - v) * k))).join('');
}
const CHIP_NAMES = ['VIP 01', 'VIP 02', 'VIP 03', 'VIP 04', 'VIP 05'];
const CHIPS = [0, 0.25, 0.5, 0.75, 1].map((k) => mixHex('#e8475f', '#f5a524', k));
document.getElementById('chips1').innerHTML = CHIPS.map((c, i) =>
  `<div class="chip"><div class="sw" style="background:${c}"></div><div class="lb">${c}</div><div class="nm">${CHIP_NAMES[i]}</div></div>`).join('');
document.getElementById('chips6').innerHTML = CHIPS.map((c) => `<div style="width:104px;height:28px;background:${c}"></div>`).join('');

// ---- chat scripts ----
const CMD_GRAD = ',role color VIP #e8475f #f5a524';
const CMD_HOLO = ',role color VIP holographic';
// Word for word from src/commands/roles/role.ts + describeRoleColors (src/services/roles/colors.ts)
const R_GRAD = '{@VIP} is now a gradient from `#e8475f` to `#f5a524`.';
const R_HOLO = '{@VIP} is now holographic.';

const hookMsgs = [
  { u: 'noor', text: 'last round, then i’m off', at: -1, time: '20:31' },
  { u: 'teo', text: 'starting', at: -1, time: '20:32' },
  { u: 'kofi', text: 'gg that was close', at: -1, time: '20:36' },
  { u: 'teo', text: 'rematch tomorrow', at: -1, time: '20:37' },
  { u: 'mira', text: 'i’m in', at: -1, time: '20:37' },
  { u: 'noor', text: 'same', at: -1, time: '20:38' },
  { u: 'gift', text: 'hi! who are the VIPs here?', at: 0.15 },
  { u: 'kofi', text: 'no idea honestly', at: B(1.5) },
  { u: 'kofi', text: 'every name looks the same', at: B(2.5) },
  { u: 'mira', text: 'i’m VIP. you can’t tell?', at: B(3.5) },
  { u: 'noor', text: 'me too lol', at: B(4.5) },
];

const actionMsgs = [
  { u: 'kofi', text: 'gg that was close', at: -1, time: '20:36' },
  { u: 'teo', text: 'rematch tomorrow', at: -1, time: '20:37' },
  { u: 'mira', text: 'i’m in', at: -1, time: '20:37' },
  { u: 'noor', text: 'same', at: -1, time: '20:38' },
  { u: 'gift', text: 'hi! who are the VIPs here?', at: -1 },
  { u: 'kofi', text: 'no idea honestly', at: -1 },
  { u: 'kofi', text: 'every name looks the same', at: -1 },
  { u: 'mira', text: 'i’m VIP. you can’t tell?', at: -1 },
  { u: 'noor', text: 'me too lol', at: -1 },
  { u: 'teo', text: CMD_GRAD, at: B(5), cmd: true, time: '20:42' },
  { u: 'bot', embed: R_GRAD, at: B(6), time: '20:42' },
];


const holoMsgs = [
  { u: 'teo', text: CMD_GRAD, at: -1, cmd: true, time: '20:42' },
  { u: 'bot', embed: R_GRAD, at: -1, time: '20:42' },
  { u: 'mira', text: 'oh that’s nice', at: -1, time: '20:42' },
  { u: 'gift', text: 'ok NOW i see you', at: -1, time: '20:43' },
  { u: 'noor', text: 'finally looks like VIP', at: -1, time: '20:43' },
  { u: 'teo', text: CMD_HOLO, at: B(3), cmd: true, time: '20:44' },
  { u: 'bot', embed: R_HOLO, at: B(4), time: '20:44' },
  { u: 'mira', text: 'wait it shimmers', at: B(5.5), time: '20:44' },
  { u: 'noor', text: 'keeping this forever', at: B(6.75), time: '20:44' },
];

function renderMembers(el, groups, t, style, holoShift, stagger) {
  el.innerHTML = groups.map((g) => `<div class="grp">${g.title}</div>` + g.users.map((k) => {
    const u = U[k];
    let cls = 'nm', st = '';
    if (u.vip && style === 'grad') cls += ' grad';
    if (u.vip && style === 'holo') { cls += ' holo'; st = `background-position:${holoShift}% 0`; }
    return `<div class="mem"><div class="av" style="background:${u.bg}">${u.i}</div><span class="${cls}" style="${st}">${u.name}</span></div>`;
  }).join('')).join('');
  if (stagger) el.querySelectorAll('.mem, .grp').forEach((r, i) => {
    const e = out4(p(t, stagger + i * 0.06, 0.4));
    r.style.transform = `translateY(${(1 - e) * 40}px)`; r.style.opacity = String(e);
  });
}

const S = [...document.querySelectorAll('.shot')];
window.render = function (shot, f) {
  const t = f / FPS;
  S.forEach((s, i) => (s.style.display = i === shot ? 'block' : 'none'));
  const sec = S[shot];
  if (shot === 0) {
    lines(sec, t, 0.0, 0.12);
    renderChat(document.getElementById('chat0'), t, hookMsgs);
  } else if (shot === 1) {
    lines(sec, t, 0.0, 0.08);
    sec.querySelectorAll('.chip').forEach((c, i) => {
      const e = out4(p(t, 0.06 + i * 0.05, 0.4));
      c.style.transform = `translateY(${(1 - e) * 140}px)`; c.style.opacity = String(e);
    });
  } else if (shot === 2) {
    const cur = document.getElementById('cur2');
    const k = inOut(p(t, 0.1, 0.7));
    const x = 780 + (330 - 780) * k, y = 1200 + (1660 - 1200) * k;
    const press = t > B(2) - 0.06 && t < B(2) + 0.06 ? 0.86 : 1;
    cur.style.left = x + 'px'; cur.style.top = y + 'px'; cur.style.transform = `scale(${press})`;
    cur.style.display = t < B(2) + 0.12 ? 'block' : 'none';
    const n = Math.round(CMD_GRAD.length * p(t, B(2) + 0.1, B(2.6)));
    let input;
    if (t >= B(2) && t < B(5)) input = { text: CMD_GRAD.slice(0, n), caret: Math.floor(t * 4) % 2 === 0 || n < CMD_GRAD.length };
    else if (t >= B(5) && t < B(6)) input = { typing: true };
    renderChat(document.getElementById('chat2'), t, actionMsgs, input, t >= B(6) + 0.25 ? 'grad' : 'flat');
    sec.querySelector('.kicker').style.opacity = String(out4(p(t, 0, 0.3)));
  } else if (shot === 3) {
    lines(sec, t, 0.0, 0.12);
    renderMembers(document.getElementById('mem3'), [{ title: 'VIP — 2', users: ['mira', 'noor'] }, { title: 'Online — 3', users: ['teo', 'kofi', 'gift'] }], t, 'grad', 0, 0.2);
  } else if (shot === 4) {
    const n = Math.round(CMD_HOLO.length * p(t, 0.25, B(2.2)));
    let input;
    if (t < B(3)) input = { text: CMD_HOLO.slice(0, n), caret: Math.floor(t * 4) % 2 === 0 || n < CMD_HOLO.length };
    else if (t < B(4)) input = { typing: true };
    const holo = t >= B(4) + 0.25;
    renderChat(document.getElementById('chat4'), t, holoMsgs, input, holo ? 'holo' : 'grad', (t * 40) % 100);
    renderMembers(document.getElementById('mem4'), [{ title: 'VIP — 2', users: ['mira', 'noor'] }], t, holo ? 'holo' : 'grad', (t * 40) % 100, 0);
    sec.querySelector('.kicker').style.opacity = String(out4(p(t, 0, 0.3)));
  } else if (shot === 5) {
    lines(sec, t, 0.0, 0.12);
    const q = out4(p(t, 0.35, 0.4)), el = document.getElementById('sub5');
    el.style.opacity = String(q); el.style.transform = `translateY(${(1 - q) * 24}px)`;
  } else if (shot === 6) {
    const e = out4(p(t, 0, 0.5));
    const logo = document.getElementById('logo6');
    logo.style.opacity = String(e); logo.style.transform = `translateY(${(1 - e) * 40}px)`;
    lines(sec, t, 0.12, 0.1);
    document.querySelectorAll('#chips6 > div').forEach((c, i) => {
      const q = out4(p(t, 0.4 + i * 0.05, 0.35));
      c.style.transform = `scaleY(${q})`;
    });
    for (const [id, a] of [['cmd6a', 0.65], ['cmd6b', 0.8], ['url6', 1.0]]) {
      const el = document.getElementById(id), q = out4(p(t, a, 0.4));
      el.style.opacity = String(q); el.style.transform = `translateY(${(1 - q) * 24}px)`;
    }
  }
};
render(0, 0);
</script>
